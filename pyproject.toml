[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-support-rag"
version = "0.1.0"
description = "Local FastAPI documentation assistant with verifiable citations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "huggingface-hub>=1.0,<2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "pydantic>=2.11,<3",
    "tokenizers>=0.21,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["support_rag*"]

[tool.setuptools.package-data]
support_rag = ["data/*.json", "data/*.txt", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
